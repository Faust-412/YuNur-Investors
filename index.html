<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет инвестора | YuNur</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: linear-gradient(165deg, #1E3A1A 0%, #14290F 100%); color: #f8f9fa; min-height: 100vh; position: relative; overflow-x: hidden; }
body::after { content: ''; position: fixed; top: -20%; right: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(232,193,90,0.10) 0%, transparent 70%); pointer-events: none; z-index: 0; }
body::before { content: ''; position: fixed; bottom: -20%; left: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(108,165,96,0.25) 0%, transparent 70%); pointer-events: none; z-index: 0; }
.pattern-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l3.5 10.5h11L36 18l3.5 10.5L30 24l-9.5 4.5L24 18l-8.5-7.5h11L30 0z' fill='%23c9a227' fill-opacity='0.05'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; }
.container { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
.login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12); width: 100%; max-width: 400px; border: 1px solid rgba(232,193,90,0.35); }
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { color: transparent; background: linear-gradient(180deg, #F8E08E 0%, #D4AF37 60%, #B8860B 100%); background-clip: text; -webkit-background-clip: text; font-size: 36px; font-weight: 700; }
.input-wrapper { position: relative; margin-bottom: 20px; }
.input-wrapper input { width: 100%; padding: 16px 50px 16px 20px; border: 1px solid rgba(232,193,90,0.35); border-radius: 14px; font-size: 16px; font-family: 'DM Sans', sans-serif; background: rgba(255,255,255,0.08); color: #f8f9fa; transition: all 0.3s; }
.input-wrapper input:focus { outline: none; border-color: #E8C15A; box-shadow: 0 0 20px rgba(232,193,90,0.3); background: rgba(255,255,255,0.12); }
.toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; color: rgba(232,193,90,0.7); user-select: none; }
.remember-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.remember-row label { color: rgba(255,255,255,0.8); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.remember-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #C9A227; cursor: pointer; }
.forgot-link { text-align: center; margin-top: 15px; }
.forgot-link a { color: rgba(232,193,90,0.7); font-size: 12px; text-decoration: none; }
.btn { width: 100%; padding: 16px 24px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-family: 'DM Sans', sans-serif; }
.btn-gold { background: linear-gradient(135deg, #F1CE6B, #C9A227); color: #1A2E22; box-shadow: 0 8px 24px rgba(201,162,39,0.35); }
.btn-gold:hover { transform: translateY(-2px); }
.error-msg { color: #FF7A7A; text-align: center; margin-top: 15px; font-weight: 500; display: none; }
.dashboard { display: none; }
.header { background: linear-gradient(180deg, #7DB871 0%, #5C9350 100%); padding: 25px 20px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(232,193,90,0.35); position: relative; overflow: hidden; }
.dagestan-flag-block { position: absolute; top: 20px; right: 20px; width: 96px; height: 64px; border-radius: 8px; border: 1px solid rgba(232,193,90,0.6); overflow: hidden; }
.dagestan-flag-block::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, #00A650 0%, #00A650 32%, #0033A0 32%, #0033A0 66%, #D22630 66%, #D22630 100%); filter: blur(1px); }
.header-top { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
.logo-small { font-size: 26px; font-weight: 700; color: transparent; background: linear-gradient(180deg, #F8E08E 0%, #D4AF37 60%, #B8860B 100%); background-clip: text; -webkit-background-clip: text; }
.investor-name { font-size: 20px; font-weight: 500; color: #f8f9fa; }
.status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; border: 1px solid rgba(232,193,90,0.6); color: #E8C15A; }
.tier-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
.tier-base { background: #fff8e1; color: #c9a227; border: 1px solid #c9a227; }
.tier-mini { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
.tier-description { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 10px; font-style: italic; }
.cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
.card { background: linear-gradient(180deg, #7DB871 0%, #5C9350 100%); padding: 20px; border-radius: 20px; border: 1px solid rgba(232,193,90,0.35); text-align: center; transition: transform 0.3s; }
.card:hover { transform: translateY(-3px); }
.card-label { font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px; font-weight: 500; }
.card-value { font-size: 30px; font-weight: 700; color: transparent; background: linear-gradient(180deg, #F8E08E 0%, #D4AF37 60%, #B8860B 100%); background-clip: text; -webkit-background-clip: text; font-variant-numeric: tabular-nums; }
.card.card-wide { grid-column: 1 / -1; }
.section-block { background: linear-gradient(180deg, #7DB871 0%, #5C9350 100%); padding: 0; border-radius: 20px; border: 1px solid rgba(232,193,90,0.35); margin-bottom: 20px; overflow: hidden; }
.section-header { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
.section-header:hover { background: rgba(255,255,255,0.05); }
.section-title { font-size: 17px; color: #E8C15A; font-weight: 700; }
.section-arrow { font-size: 14px; color: #E8C15A; transition: transform 0.3s; }
.section-block.collapsed .section-arrow { transform: rotate(-90deg); }
.section-body { padding: 0 20px 20px; }
.section-block.collapsed .section-body { display: none; }
.deals-table { width: 100%; border-collapse: collapse; }
.deals-table th { padding: 10px 8px; text-align: left; color: #E8C15A; font-size: 12px; border-bottom: 1px solid rgba(232,193,90,0.4); }
.deals-table td { padding: 10px 8px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.deals-table td:first-child { font-weight: 600; color: #F8E08E; }
.badge-returned { color: #6EE7A0; font-weight: 700; }
.badge-partial { color: #FFD54F; font-weight: 600; }
.badge-turn { color: #FFB74D; font-weight: 600; }
.filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.filter-bar select, .filter-bar input { padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(232,193,90,0.4); background: rgba(255,255,255,0.08); color: #f8f9fa; font-family: 'DM Sans', sans-serif; font-size: 14px; }
.filter-bar input { flex: 1; min-width: 140px; }
.filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: #E8C15A; }
.timeline { position: relative; padding-left: 30px; }
.timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, #F8E08E, #8A6D1F); border-radius: 3px; }
.timeline-item { position: relative; margin-bottom: 15px; padding: 15px; background: rgba(255,255,255,0.04); border-radius: 16px; border: 1px solid rgba(232,193,90,0.2); }
.timeline-item::before { content: ''; position: absolute; left: -24px; top: 20px; width: 14px; height: 14px; background: linear-gradient(135deg, #F8E08E, #C9A227); border-radius: 50%; border: 2px solid #04150E; }
.timeline-type { font-size: 14px; font-weight: 700; color: #f8f9fa; margin-bottom: 5px; }
.timeline-sub { font-size: 13px; color: #F8E08E; margin-bottom: 5px; }
.timeline-amount { font-size: 18px; font-weight: 700; }
.timeline-amount.positive { color: #6EE7A0; }
.timeline-amount.negative { color: #FF7A7A; }
.timeline-date { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 5px; }
.empty-note { color: rgba(255,255,255,0.6); text-align: center; padding: 15px; font-size: 14px; }
.btn-logout { margin-top: 10px; background: transparent; border: 1px solid rgba(232,193,90,0.5); color: #E8C15A; }
@media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } .login-box { padding: 30px 20px; } .card-value { font-size: 26px; } }
</style>
</head>
<body>
<div class="pattern-overlay"></div>

<div id="loginScreen" class="login-wrapper">
<div class="login-box">
<div class="logo"><h1>YuNur</h1><p style="color: #a5d6a7; font-size: 14px; margin-top: 5px;">Кабинет инвестора</p></div>
<div class="input-wrapper">
<input type="password" id="invCodeInput" placeholder="Код инвестора (INV-XXXX)" maxlength="8">
<span class="toggle-password" onmousedown="showPassword('invCodeInput')" onmouseup="hidePassword('invCodeInput')" onmouseleave="hidePassword('invCodeInput')">👁️</span>
</div>
<div class="input-wrapper">
<input type="password" id="phoneTailInput" placeholder="Последние 3 цифры телефона" maxlength="3">
<span class="toggle-password" onmousedown="showPassword('phoneTailInput')" onmouseup="hidePassword('phoneTailInput')" onmouseleave="hidePassword('phoneTailInput')">👁️</span>
</div>
<div class="remember-row"><label><input type="checkbox" id="rememberCheckbox"> Запомнить на этом устройстве</label></div>
<button class="btn btn-gold" onclick="login()">Войти</button>
<p id="errorMsg" class="error-msg">Не найдено, проверьте код</p>
<div class="forgot-link"><a href="#" onclick="forgetDevice(); return false;">Забыть код на этом устройстве</a></div>
</div>
</div>

<div id="dashboard" class="dashboard container">
<div class="header">
<div class="header-top"><span class="logo-small">YuNur</span><span class="investor-name" id="dashName">Имя инвестора</span></div>
<div style="display:flex; align-items:center; gap:8px;">
<span class="status-badge" id="statusBadge">Активен</span>
<span class="tier-badge tier-base" id="tierBadge" style="display:none;"></span>
</div>
<div class="tier-description" id="tierDescription"></div>
<div class="dagestan-flag-block"></div>
</div>

<div class="cards-grid">
<div class="card card-wide"><div class="card-label">На счёте</div><div class="card-value" id="cardOnAccount">0 ₽</div></div>
<div class="card"><div class="card-label">В обороте</div><div class="card-value" id="cardInTurnover">0 ₽</div></div>
<div class="card"><div class="card-label">Возвращено</div><div class="card-value" id="cardReturned">0 ₽</div></div>
<div class="card"><div class="card-label">Начислено дохода</div><div class="card-value" id="cardAccrued">0 ₽</div></div>
<div class="card"><div class="card-label">Дата окончания</div><div class="card-value" id="cardEndDate" style="font-size:22px;">--.--.----</div></div>
</div>

<div class="section-block" id="dealsSection">
<div class="section-header" onclick="toggleSection('dealsSection')">
<span class="section-title">👥 Кто взял на ваши средства</span>
<span class="section-arrow">▼</span>
</div>
<div class="section-body">
<table class="deals-table">
<thead><tr><th>Клиент</th><th>Товар</th><th>Сумма</th><th>Возвращено</th><th>Статус</th></tr></thead>
<tbody id="dealsBody"></tbody>
</table>
</div>
</div>

<div class="section-block" id="timelineSection">
<div class="section-header" onclick="toggleSection('timelineSection')">
<span class="section-title">📜 История операций</span>
<span class="section-arrow">▼</span>
</div>
<div class="section-body">
<div class="filter-bar">
<select id="typeFilter" onchange="renderTimeline()">
<option value="all">Все операции</option>
<option value="deposit">Взнос</option>
<option value="topup">Пополнение</option>
<option value="take_for_product">Взято на товар</option>
<option value="repayment">Возврат от клиента</option>
<option value="income">Доход</option>
</select>
<input type="text" id="searchFilter" placeholder="🔍 Поиск..." oninput="renderTimeline()">
</div>
<div class="timeline" id="timeline"></div>
</div>
</div>

<button class="btn btn-logout" onclick="logout()">Выйти</button>
</div>

<script>
let currentInvestor = null;
let allClients = [];
const DATA_URL = 'https://raw.githubusercontent.com/Faust-412/YuNur/main/data/investors.json';
const CLIENTS_URL = 'https://raw.githubusercontent.com/Faust-412/YuNur/main/data/clients.json';

window.addEventListener('DOMContentLoaded', function() {
const savedCode = localStorage.getItem('yn_investor_code');
const savedTail = localStorage.getItem('yn_investor_tail');
if (savedCode && savedTail) {
document.getElementById('invCodeInput').value = savedCode;
document.getElementById('phoneTailInput').value = savedTail;
document.getElementById('rememberCheckbox').checked = true;
setTimeout(() => login(), 500);
}
});

function showPassword(id) { document.getElementById(id).type = 'text'; }
function hidePassword(id) { document.getElementById(id).type = 'password'; }

function forgetDevice() {
localStorage.removeItem('yn_investor_code');
localStorage.removeItem('yn_investor_tail');
document.getElementById('invCodeInput').value = '';
document.getElementById('phoneTailInput').value = '';
document.getElementById('rememberCheckbox').checked = false;
alert('Код забыт на этом устройстве');
}

function toggleSection(id) { document.getElementById(id).classList.toggle('collapsed'); }

async function login() {
const code = document.getElementById('invCodeInput').value.trim().toUpperCase();
const tail = document.getElementById('phoneTailInput').value.trim();
const rememberCheckbox = document.getElementById('rememberCheckbox');
const errorMsg = document.getElementById('errorMsg');
if (!code || !tail) { errorMsg.style.display = 'block'; return; }
try {
const [invResp, clResp] = await Promise.all([
fetch(DATA_URL + '?t=' + Date.now()),
fetch(CLIENTS_URL + '?t=' + Date.now())
]);
if (!invResp.ok) throw new Error('investors load fail');
const investors = await invResp.json();
allClients = clResp.ok ? await clResp.json() : [];
const investor = investors.find(inv => {
const invCode = (inv.invCode || '').toUpperCase();
const invTail = inv.phoneTail || '000';
return invCode === code && invTail === tail;
});
if (!investor) { errorMsg.style.display = 'block'; return; }
currentInvestor = investor;
if (rememberCheckbox.checked) {
localStorage.setItem('yn_investor_code', code);
localStorage.setItem('yn_investor_tail', tail);
}
showDashboard();
} catch (e) {
errorMsg.style.display = 'block';
console.error(e);
}
}

function fmt(n) { return (Math.round(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('ru-RU'); }

function clientPaidSum(client) {
if (!client || !client.schedule) return 0;
return client.schedule.reduce((s, p) => s + (Number(p.paidSum) || 0), 0);
}

function computeMetrics(inv) {
let deposits = 0, accrued = 0, taken = 0;
(inv.transactions || []).forEach(t => {
const a = Number(t.amount) || 0;
if (t.type === 'deposit' || t.type === 'topup') deposits += a;
else if (t.type === 'income') { deposits += a; accrued += a; }
else if (t.type === 'take_for_product') taken += a;
});
let returned = 0;
(inv.deals || []).forEach(d => {
const client = allClients.find(c => c.hash === d.clientHash);
const paid = clientPaidSum(client);
returned += Math.min(paid, Number(d.amount) || 0);
});
const inTurnover = Math.max(0, taken - returned);
const onAccount = deposits - inTurnover;
return { onAccount, inTurnover, returned, accrued };
}

function showDashboard() {
document.getElementById('loginScreen').style.display = 'none';
document.getElementById('dashboard').style.display = 'block';
const inv = currentInvestor;
document.getElementById('dashName').textContent = inv.name;

const tier = inv.tier || 'base';
const tierBadge = document.getElementById('tierBadge');
tierBadge.style.display = 'inline-block';
if (tier === 'mini') {
tierBadge.textContent = 'Мини'; tierBadge.className = 'tier-badge tier-mini';
document.getElementById('tierDescription').textContent = 'ваши деньги работают в сделках с небольшой техникой, срок до 6 мес';
} else {
tierBadge.textContent = 'База'; tierBadge.className = 'tier-badge tier-base';
document.getElementById('tierDescription').textContent = 'сделки с крупной техникой, срок 3–10 мес';
}

const m = computeMetrics(inv);
document.getElementById('cardOnAccount').textContent = fmt(m.onAccount);
document.getElementById('cardInTurnover').textContent = fmt(m.inTurnover);
document.getElementById('cardReturned').textContent = fmt(m.returned);
document.getElementById('cardAccrued').textContent = fmt(m.accrued);

const startDate = new Date(inv.date);
const termMonths = parseInt(inv.term) || 24;
const endDate = new Date(startDate);
endDate.setMonth(endDate.getMonth() + termMonths);
document.getElementById('cardEndDate').textContent = endDate.toLocaleDateString('ru-RU');
document.getElementById('statusBadge').textContent = endDate > new Date() ? 'Активен' : 'Закрыт';

renderDeals(inv);
renderTimeline();
}

function renderDeals(inv) {
const tbody = document.getElementById('dealsBody');
tbody.innerHTML = '';
const deals = (inv.deals || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
if (deals.length === 0) {
tbody.innerHTML = '<tr><td colspan="5" class="empty-note">Пока нет клиентов на ваших средствах</td></tr>';
return;
}
deals.forEach(d => {
const client = allClients.find(c => c.hash === d.clientHash);
const name = d.clientName || (client ? client.name : '— (старая сделка)');
const amount = Number(d.amount) || 0;
const paid = clientPaidSum(client);
const returned = Math.min(paid, amount);
let statusHtml, statusClass;
if (returned >= amount) { statusHtml = 'Возвращено'; statusClass = 'badge-returned'; }
else if (returned > 0) { statusHtml = 'Частично'; statusClass = 'badge-partial'; }
else { statusHtml = 'В обороте'; statusClass = 'badge-turn'; }
const tr = document.createElement('tr');
tr.innerHTML = '<td>' + name + '</td><td>' + (d.productName || '—') + '</td><td>' + fmt(amount) + '</td><td>' + fmt(returned) + '</td><td class="' + statusClass + '">' + statusHtml + '</td>';
tbody.appendChild(tr);
});
}

function buildEvents(inv) {
const events = [];
(inv.transactions || []).forEach(t => {
const a = Number(t.amount) || 0;
if (t.type === 'take_for_product') {
const deal = (inv.deals || []).find(d => d.productName === t.name && d.date === t.date) || (inv.deals || []).find(d => d.productName === t.name);
events.push({ date: t.date, type: 'take_for_product', label: 'Взято на товар', sub: (deal && deal.clientName ? deal.clientName + ' — ' : '') + t.name, amount: a, sign: -1 });
} else if (t.type === 'deposit') {
events.push({ date: t.date, type: 'deposit', label: 'Взнос', sub: '', amount: a, sign: 1 });
} else if (t.type === 'topup') {
events.push({ date: t.date, type: 'topup', label: 'Пополнение', sub: '', amount: a, sign: 1 });
} else if (t.type === 'income') {
events.push({ date: t.date, type: 'income', label: 'Начислен доход', sub: t.name || '', amount: a, sign: 1 });
}
});
(inv.deals || []).forEach(d => {
const client = allClients.find(c => c.hash === d.clientHash);
const paid = clientPaidSum(client);
const returned = Math.min(paid, Number(d.amount) || 0);
if (returned > 0) {
const name = d.clientName || (client ? client.name : 'клиент');
events.push({ date: client && client.schedule ? (client.schedule.filter(p => (p.paidSum || 0) > 0).slice(-1)[0] || {}).date || d.date : d.date, type: 'repayment', label: 'Возврат от клиента', sub: name + ' — ' + (d.productName || ''), amount: returned, sign: 1 });
}
});
events.sort((a, b) => new Date(b.date) - new Date(a.date));
return events;
}

function renderTimeline() {
const timeline = document.getElementById('timeline');
timeline.innerHTML = '';
const typeFilter = document.getElementById('typeFilter').value;
const search = document.getElementById('searchFilter').value.toLowerCase();
let events = buildEvents(currentInvestor);
if (typeFilter !== 'all') events = events.filter(e => e.type === typeFilter);
if (search) events = events.filter(e => (e.label + ' ' + e.sub).toLowerCase().includes(search));
if (events.length === 0) {
timeline.innerHTML = '<p class="empty-note">Нет операций по фильтру</p>';
return;
}
events.forEach(e => {
const item = document.createElement('div');
item.className = 'timeline-item';
const amountClass = e.sign > 0 ? 'positive' : 'negative';
const prefix = e.sign > 0 ? '+' : '−';
item.innerHTML =
'<div class="timeline-type">' + e.label + '</div>' +
(e.sub ? '<div class="timeline-sub">' + e.sub + '</div>' : '') +
'<div class="timeline-amount ' + amountClass + '">' + prefix + fmt(e.amount) + '</div>' +
'<div class="timeline-date">' + fmtDate(e.date) + '</div>';
timeline.appendChild(item);
});
}

function logout() {
currentInvestor = null;
document.getElementById('invCodeInput').value = '';
document.getElementById('phoneTailInput').value = '';
document.getElementById('errorMsg').style.display = 'none';
document.getElementById('loginScreen').style.display = 'flex';
document.getElementById('dashboard').style.display = 'none';
}
</script>
</body>
</html>
